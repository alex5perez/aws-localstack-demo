# ========================================
# APPLICATION CONFIGURATION
# ========================================

# Server Configuration
server.port=8080

# Application Name
spring.application.name=Document Management System

# ========================================
# AWS S3 / LOCALSTACK CONFIGURATION
# ========================================

# LocalStack S3 Endpoint (cambiar a AWS real en producción)
aws.s3.endpoint=http://localhost:4566
aws.s3.region=us-east-1

# Credenciales (solo para LocalStack - en producción usar IAM roles)
aws.s3.access-key=test
aws.s3.secret-key=test

# Bucket name
aws.s3.bucket-name=documents-bucket

# Force path style (requerido para LocalStack)
aws.s3.path-style-access=true

# ========================================
# FILE UPLOAD CONFIGURATION
# ========================================

# Tamaño máximo de archivo (10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ========================================
# LOGGING CONFIGURATION
# ========================================

# Nivel de logs
logging.level.root=INFO
logging.level.com.alexp.aws=DEBUG
logging.level.software.amazon.awssdk=WARN

# Formato de logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
